name: Performance Tests
on:
  push:
    branches:
    - "master"
    paths:
    - '**/*.go'
    - '**/*.java'
  pull_request:
    branches:
    - "*"
    paths:
    - '**/*.go'
    - '**/*.java'
  workflow_dispatch:


jobs:
  performance-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [ postgres, oracle, mongodb, mysql ]
        include:
        - driver: mysql
          test_name: TestMySQLPerformance
        - driver: postgres
          test_name: TestPostgresPerformance
        - driver: oracle
          test_name: TestOraclePerformance
        - driver: mongodb
          test_name: TestMongodbPerformance

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.2'

    - name: Set up Java for Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup VPN Client
      run: |
        # Install, configure, and connect in one step
        set -eo pipefail
        sudo apt-get update -qq && sudo apt-get install -y openvpn iproute2 iputils-ping netcat-openbsd
        sudo mkdir -p /etc/openvpn/client && sudo chmod 700 /etc/openvpn/client
        echo "${{ secrets.OPENVPN_CONFIG }}" | base64 --decode | sudo tee /etc/openvpn/client/client.ovpn > /dev/null
        echo "${{ secrets.OPENVPN_USERNAME }}" | sudo tee /etc/openvpn/client/auth.txt > /dev/null
        sudo chmod 600 /etc/openvpn/client/client.ovpn /etc/openvpn/client/auth.txt
        sudo chown root:root /etc/openvpn/client/client.ovpn /etc/openvpn/client/auth.txt
        sudo openvpn --config /etc/openvpn/client/client.ovpn --daemon ovpn-client --log /var/log/openvpn-client.log --verb 3
        echo "Establishing VPN connection..."
        for i in {1..30}; do
          if ip addr show | grep -q "tun0\|tap0"; then echo "✅ VPN connected"; break; fi
          [ $i -eq 30 ] && { echo "❌ VPN timeout"; sudo cat /var/log/openvpn-client.log; exit 1; }
          sleep 2
        done
        echo "Adding manual route for private network..."
        sudo ip route add 10.8.0.0/16 dev tun0

        echo "--- Current IP Routes ---"
        ip route
        echo "-------------------------"
        echo "✅ VPN setup complete - interface established"

    - name: Install Go Dependencies
      run: go mod download

    - name: Build Project
      run: |
        go build -v ./...

    - name: Start Test Infrastructure
      run: |
        docker compose -f ./destination/iceberg/local-test/docker-compose.yml up -d

    - name: Set up Data Directories
      run: |
        sudo mkdir -p /home/runner/work/olake-vishal/olake-vishal/destination/iceberg/local-test/data/postgres-data
        sudo mkdir -p /home/runner/work/olake-vishal/olake-vishal/destination/iceberg/local-test/data/minio-data
        sudo mkdir -p /home/runner/work/olake-vishal/olake-vishal/destination/iceberg/local-test/data/ivy-cache
        sudo chown -R 999:999 /home/runner/work/olake-vishal/olake-vishal/destination/iceberg/local-test/data
        sudo chmod -R 777 /home/runner/work/olake-vishal/olake-vishal/destination/iceberg/local-test/data

    - name: Build Iceberg Sink
      working-directory: ./destination/iceberg/olake-iceberg-java-writer
      run: mvn clean package -DskipTests

    - name: Create testconfig directories
      run: |
        mkdir -p ./drivers/${{ matrix.driver }}/internal/testconfig

    - name: Create source.json from secrets
      run: |
        if [ "${{ matrix.driver }}" = "mongodb" ]; then
          echo '${{ secrets.MONGODB_SOURCE_JSON }}' | base64 --decode > ./drivers/mongodb/internal/testconfig/source.json
        elif [ "${{ matrix.driver }}" = "postgres" ]; then
          echo '${{ secrets.POSTGRES_SOURCE_JSON }}' | base64 --decode > ./drivers/postgres/internal/testconfig/source.json
        elif [ "${{ matrix.driver }}" = "oracle" ]; then
          echo '${{ secrets.ORACLE_SOURCE_JSON }}' | base64 --decode > ./drivers/oracle/internal/testconfig/source.json
        elif [ "${{ matrix.driver }}" = "mysql" ]; then
          echo '${{ secrets.MYSQL_SOURCE_JSON }}' | base64 --decode > ./drivers/mysql/internal/testconfig/source.json
        fi

    - name: Create destination.json from secrets
      run: |
        echo '${{ secrets.DESTINATION_JSON }}' > ./drivers/${{ matrix.driver }}/internal/testconfig/destination.json

    - name: Create benchmark files
      run: |
        echo '${{ secrets.BENCHMARK_JSON }}' > ./drivers/${{ matrix.driver }}/internal/testconfig/benchmark.json
        echo '${{ secrets.BENCHMARK_CDC_JSON }}' > ./drivers/${{ matrix.driver }}/internal/testconfig/benchmark_cdc.json

    - name: Run Performance Test for ${{ matrix.driver }}
      run: |
        cd ./drivers/${{ matrix.driver }}/internal
        go test -v -timeout 24h -run ${{ matrix.test_name }}

    - name: Cleanup
      if: always()
      run: |
        # VPN Cleanup
        sudo pkill -f "openvpn.*client.ovpn" || true
        sudo rm -rf /etc/openvpn/client/ /var/log/openvpn-client.log || true
        echo "VPN cleanup completed"

        # Docker Cleanup
        docker compose -f ./destination/iceberg/local-test/docker-compose.yml down
        docker compose -f ./drivers/mysql/docker-compose.yml down
        docker compose -f ./drivers/postgres/docker-compose.yml down
